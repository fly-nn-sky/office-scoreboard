<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070d1c;
  --card:#0f1830;
  --card-2:#16223f;
  --ink:#e9f0ff;
  --muted:#8fa3cf;
  --faint:#6a7ca8;
  --line:#1e2b4d;
  --line-2:#2c3d69;
  --fields:#4fb0c7;
  --fields-soft:#0e2c3a;
  --nerds:#d99f57;
  --nerds-soft:#33270f;
  --win:#4cb98a;
  --loss:#d9707f;
  --live:#e0c264;
  --win-glow:rgba(76,185,138,.18);
  --loss-glow:rgba(217,112,127,.16);
  --glow-a:rgba(79,176,199,.18);
  --glow-b:rgba(217,159,87,.16);
  --cond:"Barlow Condensed","Oswald","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse at 12% -12%,rgba(79,176,199,.05),transparent 58%),radial-gradient(ellipse at 88% -6%,rgba(217,159,87,.04),transparent 55%),repeating-linear-gradient(90deg,rgba(255,255,255,.016) 0 2px,transparent 2px 6px);min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:none;margin:0 auto;padding:0 28px 70px}

/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 0 14px;border-bottom:1px solid var(--line-2)}
.top h1{display:flex;align-items:center;gap:11px;margin:0 22px 0 0}
.bmark{width:40px;height:40px;flex:none;display:block}
.bword{font-family:var(--cond);font-weight:700;font-size:46px;line-height:.9;letter-spacing:-.025em;text-transform:lowercase;white-space:nowrap;color:var(--ink)}
.bword em{font-style:normal;color:var(--fields);background:linear-gradient(100deg,var(--fields) 15%,var(--nerds) 85%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media (max-width:640px){.bword{font-size:32px}.bmark{width:30px;height:30px}}
.nav{display:flex;gap:4px}
.nav a{padding:7px 12px;border-radius:5px;font-weight:500;font-size:14px;color:var(--muted)}
.nav a:hover{background:var(--card-2);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--bg)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:5px;background:var(--card);overflow:hidden}
.weeknav button{border:0;background:none;padding:6px 10px;font-size:16px;line-height:1}
.weeknav button:hover:not(:disabled){background:var(--card-2)}
.weeknav button:disabled{opacity:.3;cursor:default}
.weeknav span{font-family:var(--cond);font-weight:700;font-size:15px;min-width:64px;text-align:center}
.btn{background:var(--card);border:1px solid var(--line-2);border-radius:5px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{background:var(--card-2)}
.btn:focus-visible,.nav a:focus-visible,.row:focus-visible,.game:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sub{font-size:13px;color:var(--muted);padding:10px 0 0}
.sub b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:0}
@media (prefers-reduced-motion:no-preference){.dot{animation:blink 1.8s ease-in-out infinite}}
@keyframes blink{50%{opacity:.25}}

/* ---- league color coding ---- */
.lg-a{--acc:var(--fields);--acc-soft:var(--fields-soft)}
.lg-b{--acc:var(--nerds);--acc-soft:var(--nerds-soft)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:3px;background:var(--acc-soft);color:var(--acc);flex:none;line-height:1.5;border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}

/* ---- layout ---- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:22px;position:relative}
.two::before{content:"";position:absolute;top:-4px;bottom:-4px;left:50%;width:5px;margin-left:-2.5px;border-radius:3px;background:linear-gradient(180deg,var(--fields) 0%,var(--fields) 14%,var(--line-2) 50%,var(--nerds) 86%,var(--nerds) 100%);box-shadow:0 0 10px var(--glow-a),0 0 10px var(--glow-b);pointer-events:none}
@media (max-width:880px){.two{grid-template-columns:1fr;gap:24px}.two::before{display:none}}
.col{min-width:0}
.lhead{display:flex;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:12px;border-bottom:3px solid var(--acc)}
.lhead img{width:38px;height:38px;border-radius:6px;object-fit:cover;background:var(--line)}
.lhead h2{font-family:var(--cond);font-weight:700;font-size:28px;margin:0;line-height:1;color:var(--acc)}
.lhead .meta{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.35}
.lhead .meta b{color:var(--ink);font-weight:600;display:block}
.sec{margin-bottom:24px}
.sec h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 span{font-weight:400;color:var(--faint);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}

/* ---- matchup card (compact + big) ---- */
.game{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--acc);transition:border-color .12s,box-shadow .12s}
.game:hover{border-color:var(--line-2);background:var(--card-2);border-left-color:var(--acc)}
.game.live{border-left-color:var(--live)}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px}
.mside{min-width:0}
.mtop{display:flex;align-items:center;gap:8px;min-width:0}
.mav{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.avw{position:relative;display:inline-block;flex:none;line-height:0}
.crown{position:absolute;top:-8px;left:50%;width:15px;height:auto;pointer-events:none;transform:translateX(-50%) rotate(-10deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.mside.right .crown,.h2h .t.right .crown{transform:translateX(-50%) rotate(10deg)}
.h2h .crown{width:24px;top:-13px}
.mid{flex:1;min-width:0}
.mhd{font-size:11px;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnm{font-family:var(--cond);font-weight:600;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpt{font-family:var(--cond);font-weight:700;font-size:22px;line-height:1;flex:none;font-variant-numeric:tabular-nums}
.mpt.none{color:var(--faint)}
.mbar{height:4px;border-radius:2px;background:var(--line);margin:8px 0 5px;display:flex;overflow:visible}
.mbar i{height:100%;border-radius:2px;background:var(--line-2);transition:width .35s ease}
.mbar i.fav{background:var(--win);box-shadow:0 0 8px var(--win-glow)}
.mbar i.dog{background:var(--loss);box-shadow:0 0 8px var(--loss-glow)}
.mft{display:flex;align-items:baseline;gap:7px;font-size:11px;color:var(--muted);min-width:0}
.mrec{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mproj{margin-left:auto;color:var(--faint);white-space:nowrap;flex:none}
.mvs{font-family:var(--cond);font-weight:700;font-size:12px;color:var(--faint);letter-spacing:.08em;padding-top:6px;flex:none}
.mside.lose .mnm,.mside.lose .mpt{color:var(--muted)}
.mside.right .mtop{flex-direction:row-reverse}
.mside.right .mid{text-align:right}
.mside.right .mbar{justify-content:flex-end}
.mside.right .mft{flex-direction:row-reverse}
.mside.right .mproj{margin-left:0;margin-right:auto}
.gfoot{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}
.gfoot .fin{color:var(--muted);font-weight:700;letter-spacing:.05em}
.gfoot.odds{margin-top:6px;padding-top:5px;border-top:1px dashed var(--line)}
.gfoot.odds b{color:var(--acc);font-weight:600}
.gfoot.odds .pc{font-variant-numeric:tabular-nums}
.game.big .side .nm{font-size:22px}.game.big .side .pt{font-size:32px}.game.big .side img{width:34px;height:34px}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:11px;color:var(--faint);padding:8px 10px 6px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
.row{cursor:pointer}
.row:hover td{background:var(--card-2)}
.rk{font-family:var(--cond);font-weight:700;font-size:16px;color:var(--faint);width:30px;font-variant-numeric:tabular-nums}
.tc{display:flex;align-items:center;gap:9px;min-width:0;height:38px}
.tc img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.tc .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tc .h{font-size:11px;color:var(--muted);display:block;font-weight:400}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--win)}.neg{color:var(--loss)}
.stk{font-family:var(--cond);font-weight:700;font-size:14px}
.stk.W{color:var(--win)}.stk.L{color:var(--loss)}
th[data-tip]{position:relative;cursor:help}
th[data-tip] span.lbl{text-decoration:underline dotted var(--line-2);text-underline-offset:3px}
th[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);width:200px;background:var(--card-2);border:1px solid var(--line-2);color:var(--ink);font-size:11px;font-weight:400;line-height:1.45;letter-spacing:0;text-align:left;white-space:normal;padding:8px 10px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .12s ease;z-index:30;pointer-events:none}
th.r[data-tip]::after{left:auto;right:0;transform:none}
th[data-tip]:hover::after,th[data-tip]:focus-visible::after{opacity:1;visibility:visible}
.dim{color:var(--muted)}

/* ---- moves ---- */
.mv{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
.mv:last-child{border-bottom:0}
.mv .k{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.03em;width:66px;flex:none;color:var(--muted);padding-top:2px}
.mv .k.trade{color:var(--nerds)}
.add{color:var(--win);font-weight:500}
.drop{color:var(--muted);text-decoration:line-through}

/* ---- notes ---- */
.note{padding:12px 14px;font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:8px}
.note b{color:var(--ink);font-weight:600}
.note.bad{border-left:3px solid var(--loss);color:var(--ink)}
.skel{height:70px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;opacity:.6}
.status{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--card-2);border:1px solid var(--line-2);color:var(--ink);border-radius:6px;padding:7px 14px;font-size:12px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.status[hidden]{display:none}

/* ---- page headers ---- */
.crumb{font-size:13px;color:var(--muted);margin:18px 0 6px}
.crumb a{color:var(--muted)}.crumb a:hover{color:var(--ink);text-decoration:underline}
.pagehead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 20px}
.pagehead img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--line)}
.pagehead h2{font-family:var(--cond);font-weight:700;font-size:40px;line-height:1;margin:0}
.pagehead .hd{font-size:13px;color:var(--muted);margin-top:4px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:88px}
.stat b{display:block;font-family:var(--cond);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.stat.w b{color:var(--win)}

/* ---- roster & lineup ---- */
.lineup{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch}
.lineup .pos{display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:13px;color:var(--faint);padding:0 12px;border-bottom:1px solid var(--line);min-width:60px}
.pl{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);min-width:0}
.pl.right{flex-direction:row-reverse;text-align:right}
.pl img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.pl .pn{font-weight:500;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pm{font-size:11px;color:var(--muted)}
.pl .pp{margin-left:auto;font-family:var(--cond);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;flex:none}
.pl.right .pp{margin-left:0;margin-right:auto}
.pl .who{min-width:0}
.pl.top .pp{color:var(--win)}
.pl.empty .pn{color:var(--faint);font-style:italic}
.lineup .tot{font-family:var(--cond);font-weight:700;font-size:28px;padding:12px;font-variant-numeric:tabular-nums}
.lineup .tot.right{text-align:right}
.roster .pl:last-child{border-bottom:0}
.pos-QB{color:#e589b8}.pos-RB{color:#6fd39a}.pos-WR{color:#7fb3f0}.pos-TE{color:#f0b866}.pos-K{color:#b7a8f0}.pos-DEF{color:#a3b3ad}
.pl .pm b{font-weight:700}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
@media (max-width:880px){.split{grid-template-columns:1fr}}
.studs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:520px){.studs{grid-template-columns:1fr}}
.stud{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.stud img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.stud .pn{font-size:13px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stud .pm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stud .pp{margin-left:auto;font-family:var(--cond);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.stud .who{min-width:0}
.combined{margin-top:16px;padding-top:24px;border-top:1px solid var(--line-2)}
.combined .card{overflow-x:auto}
.combined table{min-width:640px}
.combined h2{font-family:var(--cond);font-size:28px;font-weight:700;margin:0 0 16px}
.sched td{padding:8px 10px}
.res{font-family:var(--cond);font-weight:700;font-size:15px;width:24px}
.res.W{color:var(--win)}.res.L{color:var(--loss)}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:16px}
.h2h .t{display:flex;align-items:center;gap:12px;min-width:0}
.h2h .t.right{flex-direction:row-reverse;text-align:right}
.h2h img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.h2h .nm{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2h .nm a:hover{text-decoration:underline}
.h2h .sc{font-family:var(--cond);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.h2h .vs{font-family:var(--cond);font-weight:600;color:var(--faint);font-size:16px}
@media (max-width:640px){
  .h2h .nm{font-size:22px}.h2h .sc{font-size:32px}.h2h img{width:40px;height:40px}
  .pagehead h2{font-size:30px}.stats{margin-left:0}
  .wrap{padding:0 14px 60px}
  .card{overflow-x:auto}
}
footer{margin-top:44px;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>
      <svg class="bmark" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="bmg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4fb0c7"/><stop offset="1" stop-color="#d99f57"/>
        </linearGradient></defs>
        <rect width="40" height="40" rx="12" fill="url(#bmg)"/>
        <g transform="rotate(-38 20 20)">
          <ellipse cx="20" cy="20" rx="12.5" ry="7.4" fill="#070d1c"/>
          <path d="M10.5 20h19" stroke="#e9f0ff" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M16.5 16.9v6.2M20 16.4v7.2M23.5 16.9v6.2" stroke="#e9f0ff" stroke-width="1.3" stroke-linecap="round"/>
        </g>
      </svg>
      <span class="bword">office <em>scoreboard</em></span>
    </h1>
    <div class="tools">
      <div class="weeknav">
        <button id="prevWk" aria-label="Previous week">&#8249;</button>
        <span id="wkNum">Week —</span>
        <button id="nextWk" aria-label="Next week">&#8250;</button>
      </div>
      <button class="btn" id="refresh">Refresh</button>
    </div>
  </header>
  <div class="sub" id="sub">Connecting to Sleeper…</div>

  <div id="view">
    <div class="two"><div class="col"><div class="skel"></div><div class="skel"></div></div><div class="col"><div class="skel"></div><div class="skel"></div></div></div>
  </div>

  <footer>Live data from the public Sleeper API. Scores refresh every 60 seconds while games are on.</footer>
</div>
<div class="status" id="status" hidden></div>

<script>
(function(){
"use strict";

/* =================== the two leagues (fixed) =================== */
var LEAGUES = {
  a: { key:"a", user:"skyflynn",   name:"Team Fields", tag:"FIELDS", cls:"lg-a", id:"1398770989822648320" },
  b: { key:"b", user:"kingstoner", name:"The Nerds",   tag:"NERDS",  cls:"lg-b", id:"1389358320728416256" }
};
/* If you ever want to pin them by ID instead of name, paste the league IDs into id:"" above. */

var API = "https://api.sleeper.app/v1", CDN = "https://sleepercdn.com";

/* ---- storage (artifact-safe, memory fallback) ---- */
var mem = {};
var store = {
  get:function(k){ if(window.storage){return window.storage.get(k).then(function(r){return r?JSON.parse(r.value):null}).catch(function(){return mem[k]||null})} return Promise.resolve(mem[k]||null) },
  set:function(k,v){ mem[k]=v; if(window.storage){return window.storage.set(k,JSON.stringify(v)).catch(function(){})} return Promise.resolve() }
};

/* ---- helpers ---- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fx(n){return (Math.round((n||0)*100)/100).toFixed(2)}
function av(id){return id?CDN+"/avatars/thumbs/"+id:""}
function initials(n){
  var w=String(n||"").replace(/[^A-Za-z0-9 _]/g," ").split(/[\s_]+/).filter(Boolean);
  if(!w.length)return "?";
  return (w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase();
}
/* teams whose manager never set a Sleeper avatar get initials instead of a blank gap */
function crown(){return '<svg class="crown" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 6 L6.5 10 L12 2.5 L17.5 10 L22 6 L22 15 L2 15 Z" fill="#e0c264" stroke="#070d1c" stroke-width="1.3" stroke-linejoin="round"/></svg>'}
function avw(t,cls,win){return '<span class="avw">'+img(tav(t),cls)+(win?crown():"")+'</span>'}
function tav(t){
  if(t.avatar)return t.avatar;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">'
    +'<rect width="64" height="64" rx="32" fill="#16223f"/>'
    +'<text x="32" y="42" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif"'
    +' font-size="27" font-weight="700" fill="#8fa3cf">'+esc(initials(t.name))+'</text></svg>';
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function img(src,cls){return '<img class="'+(cls||"")+'" src="'+esc(src)+'" alt="" onerror="this.style.visibility=\'hidden\'">'}
function say(m){var s=$("status");if(!m){s.hidden=true;return}s.textContent=m;s.hidden=false}
function rec(t){return t.wins+"-"+t.losses+(t.ties?"-"+t.ties:"")}
function api(p){return fetch(API+p,{cache:"no-store"}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error("Sleeper returned "+r.status);return r.json()})}
function fmtDate(ms){if(!ms)return "";var d=new Date(ms);return d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})+" "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function isDef(id){return /^[A-Z]{2,3}$/.test(String(id))}
function pImg(id){return isDef(id)?CDN+"/images/team_logos/nfl/"+String(id).toLowerCase()+".png":CDN+"/content/nfl/players/thumb/"+id+".jpg"}

/* ---- state ---- */
var S={season:null,week:null,liveWeek:null,L:{},players:{},sched:{a:{},b:{}},proj:{},timer:null,ready:false};

/* ---- resolve the leagues ---- */
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function leaguesFor(user,season){
  return api("/user/"+encodeURIComponent(user)).then(function(u){
    if(!u||!u.user_id)throw new Error('No Sleeper account named "'+user+'".');
    return api("/user/"+u.user_id+"/leagues/nfl/"+season).then(function(ls){return ls||[]});
  });
}
function resolve(cfg){
  if(cfg.id)return api("/league/"+cfg.id).then(function(l){if(!l)throw new Error("No league with ID "+cfg.id);return l});
  return leaguesFor(cfg.user,S.season).then(function(ls){
    var hit=ls.filter(function(l){return norm(l.name)===norm(cfg.name)})[0];
    if(hit)return hit;
    return leaguesFor(cfg.user,S.season-1).then(function(old){
      var h2=old.filter(function(l){return norm(l.name)===norm(cfg.name)})[0];
      if(h2)return h2;
      throw new Error("Could not find the league for "+cfg.user+".");
    });
  });
}

/* ---- load a league for a given week ---- */
function loadLeague(cfg,league,week){
  var id=league.league_id;
  return Promise.all([
    api("/league/"+id+"/users"),api("/league/"+id+"/rosters"),
    api("/league/"+id+"/matchups/"+week),api("/league/"+id+"/transactions/"+Math.max(1,week)),
    api("/league/"+id+"/drafts")
  ]).then(function(r){
    var users=r[0]||[],rosters=r[1]||[],byU={};
    users.forEach(function(u){byU[u.user_id]=u});
    var teams={};
    rosters.forEach(function(ro){
      var u=byU[ro.owner_id]||{},st=ro.settings||{};
      teams[ro.roster_id]={
        id:ro.roster_id,lg:cfg.key,
        name:(u.metadata&&u.metadata.team_name)||u.display_name||("Roster "+ro.roster_id),
        handle:u.display_name||"",avatar:av(u.avatar),
        wins:st.wins||0,losses:st.losses||0,ties:st.ties||0,
        pf:(st.fpts||0)+(st.fpts_decimal||0)/100,pa:(st.fpts_against||0)+(st.fpts_against_decimal||0)/100,
        pp:(st.ppts||0)+(st.ppts_decimal||0)/100,
        players:ro.players||[],starters:ro.starters||[],moves:st.total_moves||0
      };
    });
    var ranked=Object.keys(teams).map(function(k){return teams[k]}).sort(cmpTeam);
    ranked.forEach(function(t,i){t.rank=i+1});
    var draft=(r[4]||[])[0]||null;
    return {cfg:cfg,league:league,teams:teams,ranked:ranked,games:group(r[2]||[],teams),moves:r[3]||[],draft:draft,week:week};
  });
}
function cmpTeam(x,y){if(y.wins!==x.wins)return y.wins-x.wins;return y.pf-x.pf}
function group(rows,teams){
  var by={};
  rows.forEach(function(m){if(m.matchup_id==null)return;(by[m.matchup_id]=by[m.matchup_id]||[]).push(m)});
  return Object.keys(by).map(function(k){
    var sides=by[k].map(function(m){return{team:teams[m.roster_id]||{name:"Roster "+m.roster_id,wins:0,losses:0,ties:0,id:m.roster_id},pts:m.points||0,starters:m.starters||[],sp:m.starters_points||[],pp:m.players_points||{},players:m.players||[]}});
    sides.sort(function(a,b){return b.pts-a.pts});
    return {id:k,sides:sides};
  }).sort(function(a,b){return tot(b)-tot(a)});
}
function tot(g){return g.sides.reduce(function(s,x){return s+x.pts},0)}
function live(g){return tot(g)>0&&S.week===S.liveWeek}

/* ---- player names ---- */
function loadPlayers(ids){
  return store.get("sleeper_players_v2").then(function(c){
    var fresh=c&&(Date.now()-c.ts<24*3600e3);
    if(fresh&&ids.every(function(i){return c.map[i]})){S.players=c.map;return}
    if(!ids.length)return;
    say("Loading player names…");
    return fetch(API+"/players/nfl").then(function(r){return r.json()}).then(function(all){
      var map=c&&c.map?c.map:{};
      ids.forEach(function(id){var p=all[id];if(!p)return;map[id]={n:p.full_name||((p.first_name||"")+" "+(p.last_name||"")).trim()||id,p:p.position||"",t:p.team||"FA"}});
      S.players=map;say("");
      return store.set("sleeper_players_v2",{ts:Date.now(),map:map});
    }).catch(function(){say("")});
  });
}
function pName(id){var p=S.players[id];if(p)return p.n;if(isDef(id))return id+" D/ST";return "Player "+id}
function pMeta(id){var p=S.players[id];if(p)return '<b class="pos-'+esc(p.p)+'">'+esc(p.p)+'</b> '+esc(p.t);if(isDef(id))return '<b class="pos-DEF">DEF</b>';return ""}
function pPos(id){var p=S.players[id];return p?p.p:(isDef(id)?"DEF":"")}
function collectIds(){
  var ids={};
  ["a","b"].forEach(function(k){var C=S.L[k];if(!C)return;
    C.ranked.forEach(function(t){t.players.forEach(function(p){ids[p]=1})});
    C.moves.forEach(function(m){Object.keys(m.adds||{}).forEach(function(p){ids[p]=1});Object.keys(m.drops||{}).forEach(function(p){ids[p]=1})});
    C.games.forEach(function(g){g.sides.forEach(function(s){s.players.forEach(function(p){ids[p]=1})})});
  });
  delete ids["0"];
  return Object.keys(ids);
}

/* =================== routing =================== */
function route(){
  var h=location.hash.replace(/^#\/?/,"").split("/");
  return {page:h[0]||"home",a:h[1],b:h[2],c:h[3]};
}
function render(){

function gameCard(C,g,big){
  var a=g.sides[0],b=g.sides[1],t=tot(g),lv=live(g),pre=!t&&b,key=C.cfg.key+":"+g.id;
  function mSide(s,i,right){
    var tm=s.team,mine=i===0?a:b,other=i===0?b:a;
    var lose=t>0&&b&&mine.pts<other.pts;
    var won=t>0&&b&&mine.pts>other.pts&&S.week<S.liveWeek;
    var share=t>0?(s.pts/t*100):50;
    var lead=t>0&&b?(mine.pts>=other.pts):true;
    return '<div class="mside'+(right?" right":"")+(lose?" lose":"")+'">'
      +'<div class="mtop">'+avw(tm,"mav",won)
      +'<div class="mid"><div class="mhd">'+(tm.handle?"@"+esc(tm.handle):"&nbsp;")+'</div>'
      +'<div class="mnm">'+esc(tm.name)+'</div></div>'
      +'<div class="mpt'+(t?"":" none")+'">'+(t?fx(s.pts):"–")+'</div></div>'
      +'<div class="mbar"'+(pre?' data-mb="'+esc(key)+':'+i+'"':"")+'>'
      +'<i class="'+(pre?"":(lead?"fav":"dog"))+'" style="width:'+(pre?50:share).toFixed(1)+'%"></i></div>'
      +'<div class="mft">'
      +(pre?'<span class="wp" data-wp="'+esc(key)+':'+i+'">–</span>':"")
      +'<span class="mrec">'+rec(tm)+'</span>'
      +'<span class="mproj"'+(pre?' data-pj="'+esc(key)+':'+i+'"':"")+'></span>'
      +'</div></div>';
  }
  var h='<a class="game '+C.cfg.cls+(lv?" live":"")+(big?" big":"")+'" href="#/matchup/'+C.cfg.key+'/'+esc(g.id)+'">';
  h+='<div class="mrow"'+(pre?' data-odds="'+esc(key)+'"':"")+'>';
  h+=mSide(a,0,false)+'<div class="mvs">VS</div>'+(b?mSide(b,1,true):'<div></div>');
  h+='</div>';
  if(t>0&&b){
    /* sides are sorted by points, so a is the leader; past weeks are settled, the current one may still be running */
    var d=a.pts-b.pts,fin=S.week<S.liveWeek;
    var say=d===0?"Tied":esc(a.team.name)+(fin?" won by ":" leads by ")+fx(d);
    h+='<div class="gfoot"><span>'+(fin?'<b class="fin">FINAL</b> ':"")+say+'</span><span>'+fx(t)+' combined</span></div>';
  }

}
function standings(C){
  if(!C.ranked.length)return '<div class="note" style="border:0">No rosters yet.</div>';

  var h='<table><thead><tr><th></th><th>Team</th><th class="r">Rec</th><th class="r">PF</th><th class="r">PA</th>'+(eff?'<th class="r">Eff</th>':"")+'</tr></thead><tbody>';
  C.ranked.forEach(function(t){
    h+='<tr class="row" tabindex="0" data-href="#/team/'+C.cfg.key+'/'+t.id+'"><td class="rk">'+t.rank+'</td><td><div class="tc">'+img(tav(t))+'<span class="n">'+esc(t.name)+(t.handle?'<span class="h">@'+esc(t.handle)+'</span>':"")+'</span></div></td><td class="r num">'+rec(t)+'</td><td class="r num">'+fx(t.pf)+'</td><td class="r num dim">'+fx(t.pa)+'</td>'+(eff?'<td class="r num dim">'+(t.pp>0?Math.round(t.pf/t.pp*100)+"%":"—")+'</td>':"")+'</tr>';
  });
  return h+'</tbody></table>';
}
function combined(){
  var all=[];
  ["a","b"].forEach(function(k){S.L[k].ranked.forEach(function(t){all.push({t:t,C:S.L[k]})})});
  var played=all.some(function(r){return r.t.wins+r.t.losses+r.t.ties>0});
  all.sort(function(x,y){if(played&&y.t.wins!==x.t.wins)return y.t.wins-x.t.wins;return y.t.pf-x.t.pf});
  var h='<div class="combined"><h2>Whole office, one table</h2><div class="card"><table><thead><tr><th data-tip="Overall rank across both leagues, by record then points."><span class="lbl">#</span></th><th data-tip="Team name, with the manager&#39;s Sleeper handle beneath."><span class="lbl">Team</span></th><th data-tip="Which league the team plays in."><span class="lbl">League</span></th><th class="r" data-tip="Wins–losses–ties so far this season."><span class="lbl">Rec</span></th><th class="r" data-tip="Current run of consecutive results. W3 means three straight wins."><span class="lbl">Streak</span></th><th class="r" data-tip="Points For — total points this team has scored."><span class="lbl">PF</span></th><th class="r" data-tip="Points Against — total points their opponents scored on them."><span class="lbl">PA</span></th><th class="r" data-tip="Points For minus Points Against. Positive means they outscore their opponents."><span class="lbl">Diff</span></th><th class="r" data-tip="Lineup efficiency: points scored as a share of the most their roster could have scored. Measures the manager, not the players."><span class="lbl">Eff</span></th><th class="r" data-tip="Adds, drops and trades made this season."><span class="lbl">Moves</span></th></tr></thead><tbody>';
  all.forEach(function(r,i){h+='<tr class="row '+r.C.cfg.cls+'" tabindex="0" data-href="#/team/'+r.C.cfg.key+'/'+r.t.id+'"><td class="rk">'+(i+1)+'</td><td><div class="tc">'+img(tav(r.t))+'<span class="n">'+esc(r.t.name)+'</span></div></td><td><span class="tag">'+r.C.cfg.tag+'</span></td><td class="r num">'+rec(r.t)+'</td><td class="r" data-stk="'+r.C.cfg.key+':'+r.t.id+'"><span class="dim">…</span></td><td class="r num">'+fx(r.t.pf)+'</td><td class="r num dim">'+fx(r.t.pa)+'</td><td class="r num '+(r.t.pf-r.t.pa>0?"pos":r.t.pf-r.t.pa<0?"neg":"dim")+'">'+(r.t.pa>0?(r.t.pf-r.t.pa>0?"+":"")+fx(r.t.pf-r.t.pa):'<span class="dim">—</span>')+'</td><td class="r num dim">'+(r.t.pp>0?Math.round(r.t.pf/r.t.pp*100)+"%":"—")+'</td><td class="r num dim">'+(r.t.moves||0)+'</td></tr>'});
  return h+'</tbody></table></div></div>';
}


function pageMatchup(lg,gid){
  var C=S.L[lg];if(!C)return '<div class="note bad">Unknown league.</div>';
  var g=C.games.filter(function(x){return String(x.id)===String(gid)})[0];
  if(!g)return '<div class="crumb"><a href="#/">← Home</a></div><div class="note">That matchup isn\'t in week '+S.week+'. Use the week arrows or go back.</div>';
  var a=g.sides[0],b=g.sides[1]||null,lv=live(g),fin=tot(g)>0&&S.week<S.liveWeek;
  var slots=(C.league.roster_positions||[]).filter(function(p){return p!=="BN"&&p!=="IR"&&p!=="TAXI"});
  var h='<div class="'+C.cfg.cls+'"><div class="crumb"><a href="#/">Home</a> / '+esc(C.cfg.name)+' · Week '+S.week+(lv?' · <span style="color:var(--live);font-weight:600">Live</span>':"")+'</div>';
  h+='<div class="h2h card" style="padding:16px 18px">'+h2hSide(C,a,false,!tot(g),fin&&b&&a.pts>b.pts)+'<div class="vs">vs</div>'+(b?h2hSide(C,b,true,!tot(g),fin&&b.pts>a.pts):"<div></div>")+'</div>';
  h+='<div class="card"><div class="lineup">';
  slots.forEach(function(pos,i){

  });
  h+='<div class="tot">'+(tot(g)?fx(a.pts):"–")+'</div><div class="pos" style="border:0">Total</div><div class="tot right">'+(b?(tot(g)?fx(b.pts):"–"):"")+'</div>';
  h+='</div></div>';
  h+='<div class="two" style="margin-top:16px">'+bench(C,a)+(b?bench(C,b):"")+'</div></div>';
  return h;
}
function h2hSide(C,s,right,noPts,win){var t=s.team;return '<div class="t '+(right?"right":"")+'">'+avw(t,"",win)+'<div style="min-width:0"><div class="nm"><a href="#/team/'+C.cfg.key+'/'+t.id+'">'+esc(t.name)+'</a></div><div class="hd" style="font-size:12px;color:var(--muted)">'+esc(t.handle)+' · '+rec(t)+' · #'+t.rank+'</div><div class="sc">'+(noPts?"–":fx(s.pts))+'</div></div></div>'}
function plCell(s,i,pos,other,right){
  var id=s.starters[i],v=(s.sp[i]||0);

function bench(C,s){

function pageTeam(lg,rid){
  var C=S.L[lg],t=C&&C.teams[rid];

function roster(C,t,cur){
  if(!t.players.length)return '<div class="note" style="border:0">'+(C.league.status==="pre_draft"?"<b>Roster fills in after the draft"+(C.draft&&C.draft.start_time?" on "+esc(fmtDate(C.draft.start_time)):"")+".</b>":"No players on this roster.")+'</div>';
  var starters=(cur?cur.starters:t.starters)||[],slots=(C.league.roster_positions||[]).filter(function(p){return p!=="BN"&&p!=="IR"&&p!=="TAXI"});
  var h="",st={};
  starters.forEach(function(p,i){if(!p||p==="0")return;st[p]=1;h+=pRow(p,slots[i]||pPos(p),cur?(cur.sp[i]||0):null)});
  var bn=t.players.filter(function(p){return !st[p]});
  if(bn.length){h+='<div class="pl" style="background:var(--card-2)"><div class="pm" style="font-weight:600">Bench</div></div>';bn.forEach(function(p){h+=pRow(p,"BN",cur?(cur.pp[p]||0):null,true)})}
  return h;
}
function pRow(p,slot,v,dim){return '<div class="pl">'+img(pImg(p))+'<div class="who"><div class="pn">'+esc(pName(p))+'</div><div class="pm">'+pMeta(p)+'</div></div><span class="pos-'+esc(slot)+'" style="font-family:var(--cond);font-weight:700;font-size:12px;color:var(--faint);margin-left:auto">'+esc(slot)+'</span>'+(v==null?"":'<div class="pp '+(dim?"dim":"")+'" style="margin-left:14px;min-width:52px;text-align:right">'+fx(v)+'</div>')+'</div>'}
function ncdf(z){
  var t=1/(1+0.2316419*Math.abs(z)),d=0.3989422804014327*Math.exp(-z*z/2);
  var pr=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0?1-pr:pr;
}
function scoreField(C){
  var r=(C.league.scoring_settings||{}).rec;
  return r===1?"pts_ppr":r===0.5?"pts_half_ppr":"pts_std";
}
function projTotal(C,side){
  var m=S.proj[S.week]||{},ss=C.league.scoring_settings,f=scoreField(C),n=0;
  (side.starters||[]).forEach(function(p){
    if(!p||p==="0")return;
    var e=m[p];if(!e)return;
    if(ss){for(var k in ss){var w=ss[k];if(typeof w==="number"&&typeof e[k]==="number")n+=e[k]*w}}
    else if(typeof e[f]==="number")n+=e[f];
  });
  return n;
}
function loadProj(w){
  if(S.proj[w])return Promise.resolve();
  return api("/projections/nfl/regular/"+S.season+"/"+w).then(function(r){S.proj[w]=r||{}});
}
/* Spread of a head-to-head margin, in fantasy points. Calibrated against
   Sleeper's own published odds: their app showed 62% on a 17.66 pt
   projected margin, which implies a margin sd near 58. Keeping this in
   step with the app matters because everyone can compare the two. */
var MARGIN_SD=58;
function fillOdds(){
  if(!document.querySelector("[data-odds]"))return;
  function paint(id,pct,fav,proj){
    var bar=document.querySelector('[data-mb="'+id+'"]');
    if(bar&&bar.firstElementChild){
      bar.firstElementChild.style.width=pct+"%";
      bar.firstElementChild.className=fav?"fav":"dog";
    }
    var w=document.querySelector('[data-wp="'+id+'"]');
    if(w){w.textContent=pct+"%";w.className="wp "+(fav?"fav":"dog")}
    var pj=document.querySelector('[data-pj="'+id+'"]');
    if(pj)pj.textContent=fx(proj);
  }
  loadProj(S.week).then(function(){
    document.querySelectorAll("[data-odds]").forEach(function(el){
      var key=el.getAttribute("data-odds"),q=key.split(":"),C=S.L[q[0]];
      if(!C)return;
      var g=C.games.filter(function(x){return String(x.id)===q[1]})[0];
      if(!g||!g.sides[1])return;
      var pa=projTotal(C,g.sides[0]),pb=projTotal(C,g.sides[1]);
      if(!(pa>0&&pb>0))return;
      var pctA=Math.round(ncdf((pa-pb)/MARGIN_SD)*100),pctB=100-pctA,aFav=pctA>=pctB;
      paint(key+":0",pctA,aFav,pa);
      paint(key+":1",pctB,!aFav,pb);
    });
  }).catch(function(){});
}
function streakOf(C,t){
  var end=(C.league.settings&&C.league.settings.playoff_week_start)||15,k=C.cfg.key,res=[];
  for(var w=1;w<end;w++){
    var rows=S.sched[k][w]||[],me=rows.filter(function(m){return String(m.roster_id)===String(t.id)})[0];
    if(!me)continue;
    var op=rows.filter(function(m){return m.matchup_id===me.matchup_id&&m.roster_id!==me.roster_id})[0];
    if(!op)continue;
    if(!((me.points||0)+(op.points||0)>0&&w<S.liveWeek))continue;
    res.push(me.points>op.points?"W":me.points<op.points?"L":"T");
  }
  if(!res.length)return '<span class="dim">—</span>';
  var last=res[res.length-1],n=0;
  for(var i=res.length-1;i>=0&&res[i]===last;i--)n++;
  return '<span class="stk '+last+'">'+last+n+'</span>';
}
function fillStreaks(){
  var els=document.querySelectorAll("[data-stk]");
  if(!els.length)return;
  Promise.all([loadSchedule(S.L.a),loadSchedule(S.L.b)]).then(function(){
    document.querySelectorAll("[data-stk]").forEach(function(el){
      var q=el.getAttribute("data-stk").split(":"),C=S.L[q[0]],t=C&&C.teams[q[1]];
      if(t)el.innerHTML=streakOf(C,t);
    });
  }).catch(function(){
    document.querySelectorAll("[data-stk]").forEach(function(el){el.innerHTML='<span class="dim">—</span>'});
  });
}
function loadSchedule(C){
  var end=(C.league.settings&&C.league.settings.playoff_week_start)||15,id=C.league.league_id,k=C.cfg.key,jobs=[];
  for(var w=1;w<end;w++)(function(w){if(!S.sched[k][w])jobs.push(api("/league/"+id+"/matchups/"+w).then(function(r){S.sched[k][w]=r||[]}))})(w);
  return Promise.all(jobs);
}
function schedule(C,t){
  var end=(C.league.settings&&C.league.settings.playoff_week_start)||15,k=C.cfg.key,h='<table class="sched"><tbody>',any=false;
  for(var w=1;w<end;w++){
    var rows=S.sched[k][w]||[],me=rows.filter(function(m){return String(m.roster_id)===String(t.id)})[0];
    if(!me)continue;any=true;
    var op=rows.filter(function(m){return m.matchup_id===me.matchup_id&&m.roster_id!==me.roster_id})[0],ot=op&&C.teams[op.roster_id];
    var played=(me.points||0)+(op?op.points||0:0)>0&&w<S.liveWeek,res="";
    if(played&&op)res=me.points>op.points?"W":me.points<op.points?"L":"T";
    h+='<tr class="'+(ot?"row":"")+'" '+(ot?'tabindex="0" data-href="#/team/'+k+'/'+ot.id+'"':"")+'><td class="rk">'+w+'</td><td><div class="tc">'+(ot?img(ot.avatar)+'<span class="n">'+esc(ot.name)+'</span>':'<span class="dim">Bye</span>')+'</div></td><td class="r num">'+(played?fx(me.points)+' – '+fx(op?op.points:0):(w===S.liveWeek&&me.points?'<span style="color:var(--live)">'+fx(me.points)+' – '+fx(op?op.points:0)+'</span>':'<span class="dim">—</span>'))+'</td><td class="res '+res+'">'+res+'</td></tr>';
  }
  h+='</tbody></table>';
  return any?h:'<div class="note" style="border:0">Schedule appears once matchups are generated.</div>';
}

/* row clicks */
document.addEventListener("click",function(e){var r=e.target.closest(".row[data-href]");if(r&&!e.target.closest("a"))location.hash=r.getAttribute("data-href")});
document.addEventListener("keydown",function(e){if(e.key==="Enter"){var r=e.target.closest&&e.target.closest(".row[data-href]");if(r)location.hash=r.getAttribute("data-href")}});

/* =================== boot / refresh =================== */
function fail(err){
  $("view").innerHTML='<div class="note bad" style="margin-top:22px"><b>Could not load the leagues.</b><br>'+esc(err&&err.message||err)+'<br><br>If this is running inside a chat preview, the sandbox may be blocking outside requests — open the file directly or put it on any web host.</div>';
  $("sub").textContent="Not connected";
}
function boot(){
  api("/state/nfl").then(function(st){
    S.season=parseInt((st&&(st.league_season||st.season))||new Date().getFullYear(),10);
    S.liveWeek=Math.max(1,(st&&(st.display_week||st.week))||1);
    if(S.week==null)S.week=S.liveWeek;
    return Promise.all([resolve(LEAGUES.a),resolve(LEAGUES.b)]);
  }).then(function(f){
    if(f[0].season&&parseInt(f[0].season,10)!==S.season)S.season=parseInt(f[0].season,10);
    S.found=f;
    return Promise.all([loadLeague(LEAGUES.a,f[0],S.week),loadLeague(LEAGUES.b,f[1],S.week)]);
  }).then(function(c){
    S.L.a=c[0];S.L.b=c[1];S.ready=true;render();
    return loadPlayers(collectIds());
  }).then(function(){render();tick()}).catch(fail);
}
function refresh(){
  if(!S.ready)return boot();
  return Promise.all([loadLeague(LEAGUES.a,S.found[0],S.week),loadLeague(LEAGUES.b,S.found[1],S.week)]).then(function(c){
    S.L.a=c[0];S.L.b=c[1];
    if(S.week===S.liveWeek)delete S.sched.a[S.week],delete S.sched.b[S.week];
    render();
    var ids=collectIds().filter(function(i){return !S.players[i]});
    if(ids.length)return loadPlayers(collectIds()).then(render);
  }).catch(fail);
}
function tick(){clearInterval(S.timer);S.timer=setInterval(function(){if(!document.hidden)refresh()},60000)}
$("refresh").addEventListener("click",function(){say("Refreshing…");refresh().then(function(){setTimeout(function(){say("")},500)})});
$("prevWk").addEventListener("click",function(){if(S.week>1){S.week--;refresh()}});
$("nextWk").addEventListener("click",function(){if(S.week<18){S.week++;refresh()}});
boot();
})();
</script>
